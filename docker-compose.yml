version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: maintenance-postgres
    environment:
      POSTGRES_DB: maintenance_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5001:5432"
    volumes:
      - maintenance_postgres_data:/var/lib/postgresql/data

volumes:
  maintenance_postgres_data: